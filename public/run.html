<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dino Clone+</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  touch-action: manipulation;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = 300;
}
window.addEventListener("resize", resize);
resize();

// ===== 画像 =====
const img = {};
const files = [
  "run_assets/character_1.png","run_assets/character_2.png","run_assets/character_over.png",
  "run_assets/obstacle_ground.png","run_assets/obstacle_air.png",
  "run_assets/sun.png","run_assets/moon.png","run_assets/blue_moon.png","run_assets/clouds.png"
];

let loaded = 0;
files.forEach(f=>{
  img[f] = new Image();
  img[f].src = f;
  img[f].onload = ()=>{
    loaded++;
    if(loaded===files.length) start();
  };
});

// ===== 状態 =====
let player, obstacles, clouds, celestial;
let frame=0, gameOver=false;
let score=0, highScore=0;
let speed=6;
let multiplier=1;
let day=true, cycleCount=0;

// ===== 初期化 =====
function start(){
  highScore = Number(localStorage.getItem("dino_high")||0);

  player={
    x:50, y:200, vy:0, jumping:false, frame:0,
    w:40, h:40
  };

  obstacles=[];
  clouds=[{x:0},{x:400}];

  celestial={x:canvas.width,type:"sun"};

  loop();
}

// ===== 入力 =====
function jump(){
  if(!player.jumping && !gameOver){
    player.vy=-12;
    player.jumping=true;
  }
  if(gameOver){
    location.reload();
  }
}

window.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
});
window.addEventListener("touchstart",jump);

// ===== 衝突判定（余白カット）=====
function hit(a,b){
  const margin = 6;
  return (
    a.x+margin < b.x+b.w-margin &&
    a.x+a.w-margin > b.x+margin &&
    a.y+margin < b.y+b.h-margin &&
    a.y+a.h-margin > b.y+margin
  );
}

// ===== ループ =====
function loop(){
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}

// ===== 更新 =====
function update(){
  if(gameOver) return;

  // スピード上昇
  speed += 0.001;

  // プレイヤー
  player.y += player.vy;
  player.vy += 0.6;

  if(player.y>=200){
    player.y=200;
    player.vy=0;
    player.jumping=false;
  }

  if(frame%10===0){
    player.frame = 1-player.frame;
  }

  // 障害物生成
  if(frame%90===0){
    obstacles.push({
      x:canvas.width,
      y:Math.random()<0.5?220:150,
      type:Math.random()<0.5?"ground":"air",
      w:40,h:40
    });
  }

  // 移動
  obstacles.forEach(o=>o.x-=speed);
  obstacles=obstacles.filter(o=>o.x>-50);

  // 衝突
  obstacles.forEach(o=>{
    if(hit(player,o)){
      gameOver=true;
      if(score>highScore){
        localStorage.setItem("dino_high", Math.floor(score));
      }
    }
  });

  // 雲
  clouds.forEach(c=>{
    c.x -= speed*0.3;
    if(c.x<-300) c.x=canvas.width;
  });

  // 太陽/月
  celestial.x -= speed*0.25;
  if(celestial.x<-100){
    celestial.x=canvas.width;
    day=!day;
    cycleCount++;

    if(!day){
      if(cycleCount%10===0){
        celestial.type="blue_moon";
        multiplier=1.1;
      }else{
        celestial.type="moon";
        multiplier=1;
      }
    }else{
      celestial.type="sun";
      multiplier=1;
    }
  }

  // スコア
  score += 0.1 * multiplier;
}

// ===== 描画 =====
function draw(){
  ctx.fillStyle = day?"#fff":"#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save();
  if(!day) ctx.filter="invert(1)";

  // 雲
  clouds.forEach(c=>{
    ctx.drawImage(img["run_assets/clouds.png"],c.x,50,300,100);
  });

  // 太陽/月
  let cel = "run_assets/sun.png";
  if(!day){
    cel = celestial.type==="blue_moon"?"run_assets/blue_moon.png":"run_assets/moon.png";
  }
  ctx.drawImage(img[cel],celestial.x,30,80,80);

  // 地面
  ctx.fillStyle="#888";
  ctx.fillRect(0,240,canvas.width,5);

  // プレイヤー
  let char;
  if(gameOver){
    char = img["run_assets/character_over.png"];
  }else{
    char = img[player.frame?"run_assets/character_2.png":"run_assets/character_1.png"];
  }
  ctx.drawImage(char,player.x,player.y,player.w,player.h);

  // 障害物
  obstacles.forEach(o=>{
    let name = o.type==="ground"?"run_assets/obstacle_ground.png":"run_assets/obstacle_air.png";
    ctx.drawImage(img[name],o.x,o.y,o.w,o.h);
  });

  ctx.restore();

  // UI
  ctx.fillStyle = day?"#000":"#fff";
  ctx.font="20px sans-serif";
  ctx.fillText("Score: "+Math.floor(score),20,30);
  ctx.fillText("High: "+highScore,20,60);

  if(multiplier>1){
    ctx.fillText("x1.1 BONUS!",20,90);
  }

  if(gameOver){
    ctx.fillStyle="red";
    ctx.font="40px sans-serif";
    ctx.fillText("GAME OVER",canvas.width/2-120,150);
    ctx.font="20px sans-serif";
    ctx.fillText("Tap or SPACE to restart",canvas.width/2-130,180);
  }
}
</script>
</body>
</html>
